[project]
name = "formation-sparql-rdflib"
version = "0.1.0"
description = "Formation SPARQL : tutoriel rdflib (module 8) et requêtes Wikidata (module 7)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "pandas>=2.0",
    "owlrl>=6.0",
    "SPARQLWrapper>=2.0",
]

[project.optional-dependencies]
# Stockage Oxigraph pour les gros graphes (étape 10 du tutoriel)
oxigraph = ["oxrdflib>=0.4"]

[tool.uv]
package = false
